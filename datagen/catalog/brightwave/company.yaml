# Up to Rs 10,000 approves itself, up to Rs 1 lakh the department head, above that the CFO. IT hardware and software
# always need the IT head as well (rules for one category beat the ANY rules).
approval_rules: |
  rule_code,document,min_value,max_value,category_code,department_code,spend_type,approver_chain,version,effective_from,effective_to
  REQ-01,request,0.00,10000.00,ANY,ANY,ANY,auto,1,2025-04-01,
  REQ-02,request,10000.01,100000.00,ANY,ANY,ANY,dept_head,1,2025-04-01,
  REQ-03,request,100000.01,999999999.00,ANY,ANY,ANY,cfo,1,2025-04-01,
  REQ-04,request,0.00,10000.00,ITH,ANY,ANY,it_head,1,2025-04-01,
  REQ-05,request,10000.01,100000.00,ITH,ANY,ANY,dept_head>it_head,1,2025-04-01,
  REQ-06,request,100000.01,999999999.00,ITH,ANY,ANY,it_head>cfo,1,2025-04-01,
  REQ-07,request,0.00,10000.00,SWS,ANY,ANY,it_head,1,2025-04-01,
  REQ-08,request,10000.01,100000.00,SWS,ANY,ANY,dept_head>it_head,1,2025-04-01,
  REQ-09,request,100000.01,999999999.00,SWS,ANY,ANY,it_head>cfo,1,2025-04-01,
  PO-01,po,0.00,100000.00,ANY,ANY,ANY,auto,1,2025-04-01,
  PO-02,po,100000.01,999999999.00,ANY,ANY,ANY,cfo,1,2025-04-01,
  POA-01,po_amendment,0.00,100000.00,ANY,ANY,ANY,auto,1,2025-04-01,
  POA-02,po_amendment,100000.01,999999999.00,ANY,ANY,ANY,cfo,1,2025-04-01,
  VAR-01,price_variance,0.00,999999999.00,ANY,ANY,ANY,cfo,1,2025-04-01,
  PAY-01,payment_run,0.00,999999999.00,ANY,ANY,ANY,cfo,1,2025-04-01,
  SUP-01,supplier_activation,0.00,999999999.00,ANY,ANY,ANY,cfo,1,2025-04-01,

settings:
  - [budget_policy, block, Budget check result when a request exceeds the available budget (warn or block)]
  - [duplicate_window_days, "14", A request for the same item and location within this many days is flagged as a possible duplicate]
  - [split_order_window_days, "7", Requests to the same supplier or category within this window are summed to detect split orders]
  - [default_rfq_response_days, "5", Working days suppliers get to respond to an RFQ]
  - [rfq_reminder_after_days, "2", Working days after which a silent supplier is reminded]
  - [supplier_ack_due_days, "2", Working days within which a PO acknowledgement is expected]
  - [price_band_pct, "15", A quote deviating more than this percent from the benchmark price is flagged]
  - [cost_of_capital_pct, "12", Used for early-payment discount decisions]
  - [min_quotes_default, "2", Minimum quotes when the category does not say]
  - [working_saturdays, none, Company rule for Saturdays at head office (none or 1st-3rd-5th)]
  - [approval_reminder_hours, "24", Hours before an approver is reminded (one working day)]
  - [approval_escalation_hours, "48", Hours before a pending approval escalates to the next level (two working days)]
  - [auto_approve_requires_budget, "true", Auto-approval only when budget is available]
  - [po_send_requires_confirmation, "true", A person confirms before a PO is sent to a supplier]
  - [grn_edit_window_days, "3", Days a goods receipt can be corrected after posting]
  - [invoice_receipt_mailbox, invoices@brightwave.example, Mailbox where supplier invoices arrive]
  - [request_mailbox, requests@brightwave.example, Mailbox where staff email requests]
  - [purchase_mailbox, purchase@brightwave.example, Mailbox buyers use for supplier correspondence]
  - [tds_applicable_on_goods, "true", Buyer turnover is above Rs 10 crore so TDS on purchase of goods applies]

tolerances:
  - [price_pct, "2.00", Invoice price above PO price by this percent is within tolerance]
  - [price_abs, "500.00", Or by this many rupees per line]
  - [qty_pct, "0.00", Invoiced quantity above received quantity is not allowed]
  - [small_diff_abs, "100.00", Total invoice difference up to this amount is accepted]
  - [receipt_over_pct, "0.00", Receipt above ordered quantity is not accepted]
  - [supplier_change_pct, "5.00", Supplier quantity or price change accepted by the agent up to this percent]
  - [supplier_date_days, "3", Supplier delivery date slip accepted by the agent up to this many days]

