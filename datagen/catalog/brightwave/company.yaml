# Brightwave Technologies Private Limited: a fictional IT services company with one office and no production.
# Read by datagen/generator/company_profile.py.
# Safety rules of this repo: PANs carry 0000 (never issued), phones are +91 00000 ..., emails end in .example.

dataset: brightwave-v1
description: One IT services office, nine people, sixteen items, five suppliers, a rate contract and a service contract, twelve months of history to 31 October 2026. New joiners as ERP input.
tenant: brightwave
hold_out_suppliers: [SUP-002]  # kept back from tuning the document readers (splits.json, used by generator/documents.py)

company:
  code: BRIGHT
  legal_name: Brightwave Technologies Private Limited
  short_name: Brightwave Technologies
  pan: BRTCB0000T
  cin: U62011KA2016PTC000003
  registered_address: 4th Floor, Tech Park Road, Bellandur, Bengaluru, Karnataka 560103
  turnover_band: 10-500cr
  currency: INR
  email_domain: brightwave.example

location:
  code: OFF-BLR
  name: Office, Bengaluru
  type: office
  address: 4th Floor, Tech Park Road, Bellandur
  city: Bengaluru
  state_code: "29"
  pincode: "560103"
  working_days: Mon-Fri
  receiving_hours: "09:30-18:00"
  loc_short: BLR

company_bank_account: {bank_code: ICICI, account_no: "000000000301", ifsc: ICIC0009993}
opening_stock_date: "2026-11-01"
price_list_dates: ["2026-10-01", "2026-12-30"]  # last prices paid: the date paid, and 90 days on
replenishment_department: ADM  # office supplies are planned for Admin and Facilities

# code, name, head
departments:
  - [ENG, Engineering, U07]
  - [ITO, IT Operations, U08]
  - [ADM, Admin and Facilities, U09]
  - [FIN, Finance, U05]
  - [MGT, Management, U09]

# login is the part of the email before the @; roles are the jobs held in the organisation's own table
people:
  - {code: U01, name: Kiran Nair, designation: Software Engineer, department: ENG, manager: U07, limit: "0.00", login: employee, roles: [requester]}
  - {code: U02, name: Lakshmi Menon, designation: Facilities Executive, department: ADM, manager: U09, limit: "0.00", login: facilities, roles: [requester, store]}
  - {code: U03, name: Arjun Reddy, designation: Buyer, department: ADM, manager: U09, limit: "0.00", login: buyer, roles: [requester, buyer]}
  - {code: U04, name: Deepa Iyengar, designation: AP Executive, department: FIN, manager: U05, limit: "0.00", login: ap, roles: [requester, ap]}
  - {code: U05, name: Rohan Kapoor, designation: Finance Manager, department: FIN, manager: U09, limit: "0.00", login: finance, roles: [requester, finance]}
  - {code: U06, name: Admin, designation: System Administrator, department: ITO, manager: U08, limit: "0.00", login: admin, roles: [requester, admin]}
  - {code: U07, name: Kavya Rao, designation: Head of Engineering, department: ENG, manager: U09, limit: "100000.00", login: depthead, roles: [requester, approver]}
  - {code: U08, name: Vivek Menon, designation: IT Head, department: ITO, manager: U09, limit: "100000.00", login: ithead, roles: [requester, approver]}
  - {code: U09, name: Farah Khan, designation: Chief Financial Officer, department: MGT, manager: "", limit: "99999999.00", login: cfo, roles: [requester, approver]}
  - {code: U10, name: Sneha Pillai, designation: IT Systems Administrator, department: ITO, manager: U08, limit: "0.00", login: admin2, roles: [requester, admin]}  # the second administrator who approves control changes (D-22)

# how a role named in an approval chain becomes a person (the approver_role table)
approver_roles:
  - [dept_head, department_head, null]
  - [it_head, designation, IT Head]
  - [cfo, designation, Chief Financial Officer]

# code, name, department, owner
cost_centres:
  - [CC-ENG, Engineering, ENG, U07]
  - [CC-ITO, IT Operations, ITO, U08]
  - [CC-ADM, Admin and Facilities, ADM, U09]

# Up to Rs 10,000 approves itself, up to Rs 1 lakh the department head, above that the CFO. IT hardware and software
# always need the IT head as well (rules for one category beat the ANY rules). Capital purchases from Rs 10,000 to
# Rs 1 lakh are also seen by the CFO ('+' adds to the chain chosen by value).
approval_rules: |
  rule_code,document,min_value,max_value,category_code,department_code,location_code,spend_type,approver_chain,version,effective_from,effective_to
  REQ-01,request,0.00,10000.00,ANY,ANY,ANY,ANY,auto,1,2025-04-01,
  REQ-02,request,10000.01,100000.00,ANY,ANY,ANY,ANY,dept_head,1,2025-04-01,
  REQ-03,request,100000.01,999999999.00,ANY,ANY,ANY,ANY,cfo,1,2025-04-01,
  REQ-04,request,0.00,10000.00,ITH,ANY,ANY,ANY,it_head,1,2025-04-01,
  REQ-05,request,10000.01,100000.00,ITH,ANY,ANY,ANY,dept_head>it_head,1,2025-04-01,
  REQ-06,request,100000.01,999999999.00,ITH,ANY,ANY,ANY,it_head>cfo,1,2025-04-01,
  REQ-07,request,0.00,10000.00,SWS,ANY,ANY,ANY,it_head,1,2025-04-01,
  REQ-08,request,10000.01,100000.00,SWS,ANY,ANY,ANY,dept_head>it_head,1,2025-04-01,
  REQ-09,request,100000.01,999999999.00,SWS,ANY,ANY,ANY,it_head>cfo,1,2025-04-01,
  REQ-10,request,10000.01,100000.00,ANY,ANY,ANY,capex,+cfo,1,2025-04-01,
  PO-01,po,0.00,100000.00,ANY,ANY,ANY,ANY,auto,1,2025-04-01,
  PO-02,po,100000.01,999999999.00,ANY,ANY,ANY,ANY,cfo,1,2025-04-01,
  POA-01,po_amendment,0.00,100000.00,ANY,ANY,ANY,ANY,auto,1,2025-04-01,
  POA-02,po_amendment,100000.01,999999999.00,ANY,ANY,ANY,ANY,cfo,1,2025-04-01,
  VAR-01,price_variance,0.00,999999999.00,ANY,ANY,ANY,ANY,cfo,1,2025-04-01,
  PAY-01,payment_run,0.00,999999999.00,ANY,ANY,ANY,ANY,cfo,1,2025-04-01,
  SUP-01,supplier_activation,0.00,999999999.00,ANY,ANY,ANY,ANY,cfo,1,2025-04-01,

# the autonomy gate (set by `demo reset`): no touchless orders here, a buyer issues every order
autonomy:
  po.issue: propose

settings:
  - [budget_policy, block, Budget check result when a request exceeds the available budget (warn or block)]
  - [budget_warn_pct, "90", A request that brings the budget used to this percent or more carries a warning (decision D36)]
  - [budget_block_pct, "100", A request that brings the budget used above this percent is over budget and follows budget_policy (decision D36)]
  - [combine_window_days, "7", Shortfall and restock lines for the same item and delivery location needed within this many days of each other are bought on one requisition line]
  - [duplicate_window_days, "14", A request for the same item and location within this many days is flagged as a possible duplicate]
  - [split_order_window_days, "7", Requests to the same supplier or category within this window are summed to detect split orders]
  - [default_rfq_response_days, "5", Working days suppliers get to respond to an RFQ]
  - [rfq_reminder_after_days, "2", Working days after which a silent supplier is reminded]
  - [supplier_ack_due_days, "2", Working days within which a PO acknowledgement is expected]
  - [delivery_reminder_before_days, "2", Working days before the promised date a supplier is reminded (once)]
  - [delivery_overdue_after_days, "1", Working days after a missed promised date the first reminder goes while nothing has arrived]
  - [delivery_overdue_every_days, "3", Working days between further reminders about a missed delivery]
  - [delivery_overdue_max, "3", Reminders about a missed delivery at most]
  - [price_band_pct, "15", A quote deviating more than this percent from the benchmark price is flagged]
  - [cost_of_capital_pct, "12", Used for early-payment discount decisions]
  - [min_quotes_default, "2", Minimum quotes when the category does not say]
  - [working_saturdays, none, Company rule for Saturdays at head office (none or 1st-3rd-5th)]
  - [approval_reminder_hours, "24", Hours before an approver is reminded (one working day)]
  - [approval_reminder_days, "1", Working days before a request approver is reminded by email (once)]
  - [approval_escalation_days, "2", Working days before a waiting request approval escalates to the approver's manager or the next approver]
  - [approval_otp_above, "500000.00", Approving a request by email above this value needs a one-time code sent to the approver]
  - [auto_approve_requires_budget, "true", Auto-approval only when budget is available]
  - [po_send_requires_confirmation, "true", A person confirms before a PO is sent to a supplier]
  - [manual_mark_paid, "true", "Synthetic demo data only, Finance may record a payment by hand (off for every real company until settlement evidence is built)"]
  - [grn_edit_window_days, "3", Days a goods receipt can be corrected after posting]
  - [invoice_receipt_mailbox, invoices@brightwave.example, Mailbox where supplier invoices arrive]
  - [request_mailbox, requests@brightwave.example, Mailbox where staff email requests]
  - [purchase_mailbox, purchase@brightwave.example, Mailbox buyers use for supplier correspondence]
  - [tds_applicable_on_goods, "true", Buyer turnover is above Rs 10 crore so TDS on purchase of goods applies]
  - [msme_max_days, "45", Most days a micro or small supplier may be paid in when agreed in writing (MSMED Act section 15)]
  - [msme_no_agreement_days, "15", Days a micro or small supplier must be paid in without a written agreement (MSMED Act section 15)]
  - [msme_warn_days, "7", Invoices of small suppliers reaching their deadline within this many days are listed]

tolerances:
  - [price_pct, "2.00", Invoice price above PO price by this percent is within tolerance]
  - [price_abs, "500.00", Or by this many rupees per line]
  - [qty_pct, "0.00", Invoiced quantity above received quantity is not allowed]
  - [small_diff_abs, "100.00", Total invoice difference up to this amount is accepted]
  - [receipt_over_pct, "0.00", Receipt above ordered quantity is not accepted]
  - [supplier_change_pct, "5.00", Supplier quantity change noted by the agent up to this percent]
  - [supplier_price_pct, "2.00", Supplier price rise a buyer may accept up to this percent; above it the purchase manager decides]
  - [supplier_date_days, "3", Supplier delivery date slip accepted by the agent up to this many days]

budgets:
