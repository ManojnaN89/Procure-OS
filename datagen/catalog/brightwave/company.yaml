# Twelve months of history before the cutoff (decision D37), read by datagen/generator/history.py. It ends at the
# opening stock above. The settings mean what they mean in datagen/catalog/apex/company.yaml.
history:
  start: "2025-11-01"
  cutoff: "2026-10-31"
  seed: 42
  buying_days: [Mon, Wed, Fri]
  payment_day: Wed
  planned_buy_by: "2026-09-30"
  people: {requester: U06, receiver: U02, ap: U04, payer: U05, buyer: U03}
  cost_centre: {ITH: CC-ITO, SWS: CC-ITO, OFS: CC-ADM, FAC: CC-ADM}  # a joiner's kit is charged to the joiner's department
  route:
    reorder_within_days: 90
    reorder_on_time_pct: 80
    reorder_line_below: "25000.00"
    reorder_price_pct: "2.00"
    two_quotes_up_to: "200000.00"
    value_window_days: 30
    split_award: 0.1  # share of RFQ lines where the lowest quote offers only part and the next lowest supplies the rest
  price_rise_pct_per_quarter: "0.50"
  suppliers:
    SUP-001: {on_time: 0.92, late: [1, 3], part: 0.05, reject: 0.0, ack: [0, 1], reply: [1, 2], date_change: 0.05, slip: [2, 4], lead_extra: 0}
    SUP-002: {on_time: 0.8, late: [2, 5], part: 0.08, reject: 0.0, ack: [0, 2], reply: [1, 3], date_change: 0.1, slip: [2, 5], lead_extra: 1}
    SUP-003: {on_time: 0.97, late: [1, 1], part: 0.0, reject: 0.0, ack: [0, 1], reply: [1, 1], date_change: 0.0, slip: [1, 1], lead_extra: 0}
    SUP-004: {on_time: 0.9, late: [1, 2], part: 0.05, reject: 0.0, ack: [0, 1], reply: [1, 2], date_change: 0.03, slip: [1, 2], lead_extra: 0}
    SUP-005: {on_time: 0.95, late: [1, 2], part: 0.0, reject: 0.0, ack: [0, 1], reply: [1, 2], date_change: 0.02, slip: [1, 2], lead_extra: 0}
  quoters:
    LP-01: {SUP-002: "1.03"}
    LP-02: {SUP-002: "1.02"}
  joiners:  # joiner plans: joiners a month per department in two intakes, each kit asked for some days ahead
    per_month: {ENG: [2, 5], ITO: [1, 2], ADM: [0, 2]}
    kit: {ENG: developer, ITO: standard, ADM: standard}
    intakes: [1, 3]  # the first and third Monday of the month
    notice_days: [12, 16]  # working days from the kit request to the start date
    last_start: "2026-10-26"
  peripherals:  # replacements asked for from stock, a few a month
    HS-01: [1, 3]
    KB-01: [1, 3]
  consumption:
    OS-01: {chance: 0.8, qty: [2, 6]}
    OS-02: {chance: 0.2, qty: [1, 1]}
    OS-03: {chance: 0.6, qty: [1, 1]}
    OS-04: {chance: 0.9, qty: [2, 6]}
  services:  # bought once in each month listed (all: every month); usage: the month's bill as a share of the price
    - {item: SV-01, months: all}
    - {item: SV-02, months: all}
    - {item: SV-03, months: ["2026-01", "2026-04", "2026-07"]}
    - {item: SV-03, months: ["2026-10"], day: 29}  # ordered at the end of October, done in November
    - {item: CL-01, months: all, usage: [0.85, 1.2]}
    - {item: SW-02, months: ["2026-02"], qty: 3}
    - {item: SW-01, months: ["2026-04"], qty: 24}
  emergency: {items: [OS-02, OS-04], count: 3, qty: [1, 2]}
  split_orders:
    - {item: MN-01, qty: "9", day: "2026-01-12"}
  planted:
    duplicate_invoice: 2
    price_mismatch: 3
    qty_mismatch: 2
    receipt_without_po: 1
