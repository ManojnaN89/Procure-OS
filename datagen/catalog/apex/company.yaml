# Twelve months of history before the cutoff (decisions D36 and D37), read by datagen/generator/history.py. It ends at
# the opening stock above, with nothing open for the materials of MO-1.
history:
  start: "2025-11-01"
  cutoff: "2026-10-31"
  seed: 42
  buying_days: [Mon, Wed, Fri]  # the buyer turns approved requisition lines into orders and RFQs on these days
  payment_day: Thu  # the weekly payment run
  planned_buy_by: "2026-09-30"  # the last day materials are requisitioned; later requests are served from stock
  people: {requester: U01, receiver: U02, ap: U04, payer: U05, buyer: U03}
  cost_centre: {RAW: CC-PRD, PKG: CC-PRD, MRO: CC-MNT, SRV: CC-MNT}  # where each category is charged
  route:  # how a requisition line is bought, in this order: contract, single source, emergency, safe reorder, RFQ
    reorder_within_days: 90  # safe reorder: the same supplier was used within this many days,
    reorder_on_time_pct: 80  # delivered on time at least this often,
    reorder_line_below: "25000.00"  # the line is worth less than this,
    reorder_price_pct: "2.00"  # and its price rose by no more than this since the last order
    two_quotes_up_to: "200000.00"  # an RFQ needs two quotes up to this value and three above
    value_window_days: 30  # the value is counted per item over the requisitions of this many days
    split_award: 0.15  # share of RFQ lines where the lowest quote offers only part and the next lowest supplies the rest
  price_rise_pct_per_quarter: "1.00"  # the price records are the last prices paid; earlier prices were lower
  # on_time: share delivered by the promised date, else late by `late` days; part: share delivered in two lots;
  # reject: share of inspected lots partly rejected; ack and reply: working days to confirm an order and answer an RFQ;
  # date_change: share of orders where the supplier asks for a later date, by `slip` days; lead_extra: days on top
  suppliers:
    SUP-001: {on_time: 0.95, late: [1, 2], part: 0.03, reject: 0.0, ack: [0, 1], reply: [1, 2], date_change: 0.03, slip: [2, 4], lead_extra: 0}
    SUP-002: {on_time: 0.55, late: [3, 9], part: 0.35, reject: 0.2, ack: [1, 3], reply: [2, 4], date_change: 0.15, slip: [3, 7], lead_extra: 1}
    SUP-003: {on_time: 0.9, late: [1, 3], part: 0.05, reject: 0.0, ack: [0, 1], reply: [1, 2], date_change: 0.05, slip: [2, 4], lead_extra: 0}
    SUP-004: {on_time: 0.9, late: [1, 2], part: 0.03, reject: 0.0, ack: [0, 1], reply: [1, 2], date_change: 0.03, slip: [1, 3], lead_extra: 0}
    SUP-005: {on_time: 0.85, late: [1, 4], part: 0.08, reject: 0.0, ack: [0, 2], reply: [1, 3], date_change: 0.05, slip: [2, 4], lead_extra: 0}
    SUP-006: {on_time: 0.75, late: [2, 6], part: 0.1, reject: 0.05, ack: [1, 2], reply: [2, 4], date_change: 0.08, slip: [2, 5], lead_extra: 3}
  quoters:  # suppliers asked to quote for an item they hold no price record for, at this share of the item's price
    RM-06: {SUP-005: "1.08"}
    RM-07: {SUP-006: "1.06", SUP-005: "1.10"}
    RM-08: {SUP-006: "1.03"}
    RM-09: {SUP-006: "1.05", SUP-005: "1.04"}
    RM-10: {SUP-006: "1.07"}
    RM-11: {SUP-003: "1.04"}
  production:  # production orders: from sales orders or the month's demand plan, each with a material request
    orders_per_month: {FG-01: [2, 4], FG-02: [2, 4]}
    qty: {FG-01: [20, 40], FG-02: [25, 50]}
