# Apex Pumps Private Limited: a fictional pump maker with one plant. Read by datagen/generator/company_profile.py.
# Safety rules of this repo: PANs carry 0000 (never issued), phones are +91 00000 ..., emails end in .example.

dataset: apex-v1
description: One pump plant (a second plant at Sanand starts in January 2027), ten people, sixteen items, six suppliers in use plus a blocked one and two prospects, one rate contract, twelve months of history to 31 October 2026. Production orders as ERP input.
tenant: apex
hold_out_suppliers: [SUP-005]  # kept back from tuning the document readers (splits.json, used by generator/documents.py)

company:
  code: APEX
  legal_name: Apex Pumps Private Limited
  short_name: Apex Pumps
  pan: APXCA0000P
  cin: U28132MH2012PTC000002
  registered_address: Plot 21, MIDC Chakan Phase I, Pune, Maharashtra 410501
  turnover_band: 10-500cr
  currency: INR
  email_domain: apexpumps.example

location:
  code: PLT-CKN
  name: Plant, Chakan (Pune)
  type: plant
  address: Plot 21, MIDC Chakan Phase I
  city: Pune
  state_code: "27"
  pincode: "410501"
  working_days: Mon-Sat
  receiving_hours: "08:00-17:00"
  loc_short: CKN
  head: U07  # the plant head: the approver role plant_head is the head of the request's delivery location

# the locations after the first (`location:` is where the history happened); none of them has history or stock
locations:
  - code: PLT-SND
    name: Plant 2, Sanand (Ahmedabad)
    type: plant
    address: Plot 14, Sanand GIDC Phase II
    city: Ahmedabad
    state_code: "24"
    pincode: "382110"
    working_days: Mon-Sat
    receiving_hours: "08:00-17:00"
    loc_short: SND
    head: U07  # until a plant head joins; trial production from January 2027
    stock: false  # not yet a stock location: no store until it opens, so ERP files without a plant still go to Chakan

# a region is a named group of locations; a supplier's approval or a contract price may be limited to one (D44)
regions:
  - {code: MH, name: Maharashtra plants, locations: [PLT-CKN]}
  - {code: GJ, name: Gujarat plants, locations: [PLT-SND]}

company_bank_account: {bank_code: HDFC, account_no: "000000000201", ifsc: HDFC0009992}
opening_stock_date: "2026-11-01"
price_list_dates: ["2026-10-01", "2026-12-30"]  # last prices paid: the date paid, and 90 days on
replenishment_department: PRD  # whose head stands in as the manager of requests made from stock levels

# code, name, head
departments:
  - [PRD, Production, U01]
  - [STR, Stores, U02]
  - [PUR, Purchase, U08]
  - [FIN, Finance and Accounts, U05]
  - [MGT, Management, U09]

# login is the part of the email before the @; roles are the jobs held in the organisation's own table
people:
  - {code: U01, name: Rahul Deshmukh, designation: Production Manager, department: PRD, manager: U07, limit: "0.00", login: production, roles: [requester]}
  - {code: U02, name: Sunil Pawar, designation: Storekeeper, department: STR, manager: U07, limit: "0.00", login: store, roles: [requester, store]}
  - {code: U03, name: Neha Kulkarni, designation: Buyer, department: PUR, manager: U08, limit: "0.00", login: buyer, roles: [requester, buyer]}
  - {code: U04, name: Priya Shah, designation: AP Executive, department: FIN, manager: U05, limit: "0.00", login: ap, roles: [requester, ap]}
  - {code: U05, name: Anil Mehta, designation: Finance Manager, department: FIN, manager: U09, limit: "0.00", login: finance, roles: [requester, finance]}
  - {code: U06, name: Admin, designation: System Administrator, department: MGT, manager: U07, limit: "0.00", login: admin, roles: [requester, admin]}
  - {code: U07, name: Vikram Joshi, designation: Plant Head, department: MGT, manager: U09, limit: "100000.00", login: planthead, roles: [requester, approver]}
  - {code: U08, name: Sanjay Rao, designation: Purchase Manager, department: PUR, manager: U07, limit: "500000.00", login: purchasemanager, roles: [requester, approver]}
  - {code: U09, name: Meera Iyer, designation: Director, department: MGT, manager: "", limit: "99999999.00", login: director, roles: [requester, approver]}
  - {code: U10, name: Kavita Bhosale, designation: ERP Administrator, department: FIN, manager: U05, limit: "0.00", login: admin2, roles: [requester, admin]}  # the second administrator who approves control changes (D-22)

# how a role named in an approval chain becomes a person (the approver_role table)
approver_roles:
  - [plant_head, location_head, null]
  - [purchase_manager, designation, Purchase Manager]
  - [director, designation, Director]

# code, name, department, owner
cost_centres:
  - [CC-PRD, Production (materials), PRD, U01]
  - [CC-MNT, Maintenance (spares and services), PRD, U01]

# decision D36: up to Rs 10,000 approves itself, up to Rs 1 lakh the head of the plant the goods go to, above that the
# director. Capital purchases above Rs 1 lakh are also seen by the purchase manager ('+' adds to the chain chosen by value).
# A row may name a category, department, location (location_code) or spend type; the most specific replacing row wins,
# in the order of the setting approval_precedence.
approval_rules: |
  rule_code,document,min_value,max_value,category_code,department_code,location_code,spend_type,approver_chain,version,effective_from,effective_to
  REQ-01,request,0.00,10000.00,ANY,ANY,ANY,ANY,auto,1,2025-04-01,
  REQ-02,request,10000.01,100000.00,ANY,ANY,ANY,ANY,plant_head,1,2025-04-01,
  REQ-03,request,100000.01,999999999.00,ANY,ANY,ANY,ANY,director,1,2025-04-01,
  REQ-04,request,100000.01,999999999.00,ANY,ANY,ANY,capex,+purchase_manager,1,2025-04-01,
  PO-01,po,0.00,100000.00,ANY,ANY,ANY,ANY,auto,1,2025-04-01,
  PO-02,po,100000.01,500000.00,ANY,ANY,ANY,ANY,purchase_manager,1,2025-04-01,
  PO-03,po,500000.01,999999999.00,ANY,ANY,ANY,ANY,director,1,2025-04-01,
  POA-01,po_amendment,0.00,100000.00,ANY,ANY,ANY,ANY,auto,1,2025-04-01,
  POA-02,po_amendment,100000.01,500000.00,ANY,ANY,ANY,ANY,purchase_manager,1,2025-04-01,
  POA-03,po_amendment,500000.01,999999999.00,ANY,ANY,ANY,ANY,director,1,2025-04-01,
  VAR-01,price_variance,0.00,999999999.00,ANY,ANY,ANY,ANY,purchase_manager,1,2025-04-01,
  PAY-01,payment_run,0.00,999999999.00,ANY,ANY,ANY,ANY,director,1,2025-04-01,
  SUP-01,supplier_activation,0.00,999999999.00,ANY,ANY,ANY,ANY,director,1,2025-04-01,
  FWD-01,forward_buy,0.00,999999999.00,ANY,ANY,ANY,ANY,purchase_manager,1,2025-04-01,

# the autonomy gate (not master data; set by `demo reset`). po.issue: touchless orders (D35), issued and sent with no
# buyer for contract and safe-reorder lines within the buyer's tier; the tests and limits are rows of touchless_rule
autonomy:
  po.issue: auto

settings:
  - [budget_policy, block, Budget check result when a request exceeds the available budget (warn or block)]
  - [budget_warn_pct, "90", A request that brings the budget used to this percent or more carries a warning (decision D36)]
  - [budget_block_pct, "100", A request that brings the budget used above this percent is over budget and follows budget_policy (decision D36)]
  - [combine_window_days, "7", Shortfall and restock lines for the same item and delivery location needed within this many days of each other are bought on one requisition line]
  - [duplicate_window_days, "14", A request for the same item and location within this many days is flagged as a possible duplicate]
  - [split_order_window_days, "7", Requests to the same supplier or category within this window are summed to detect split orders]
  - [default_rfq_response_days, "5", Working days suppliers get to respond to an RFQ]
  - [rfq_reminder_after_days, "2", Working days after which a silent supplier is reminded]
  - [supplier_ack_due_days, "2", Working days within which a PO acknowledgement is expected]
  - [delivery_reminder_before_days, "2", Working days before the promised date a supplier is reminded (once)]
  - [delivery_overdue_after_days, "1", Working days after a missed promised date the first reminder goes while nothing has arrived]
  - [delivery_overdue_every_days, "3", Working days between further reminders about a missed delivery]
  - [delivery_overdue_max, "3", Reminders about a missed delivery at most]
  - [price_band_pct, "15", A quote deviating more than this percent from the request's estimate is flagged]
  - [cost_of_capital_pct, "12", Used for early-payment discount decisions]
  - [min_quotes_default, "2", Minimum quotes when the category does not say]
  - [approval_reminder_hours, "24", Hours before an approver is reminded (one working day)]
  - [approval_reminder_days, "1", Working days before a request approver is reminded by email (once)]
  - [approval_escalation_days, "2", Working days before a waiting request approval escalates to the approver's manager or the next approver]
  - [approval_otp_above, "500000.00", "Approving a purchase order above this value needs a code sent to the approver. Every decision from an email link needs a code whatever the value."]
  - [auto_approve_requires_budget, "true", Auto-approval only when budget is available]
  - [po_send_requires_confirmation, "true", A person confirms before a PO is sent to a supplier]
  - [manual_mark_paid, "true", "Synthetic demo data only, Finance may record a payment by hand (off for every real company until settlement evidence is built)"]
  - [grn_edit_window_days, "3", Days a goods receipt can be corrected after posting]
  - [invoice_receipt_mailbox, invoices@apexpumps.example, Mailbox where supplier invoices arrive]
  - [request_mailbox, requests@apexpumps.example, Mailbox where staff email requests]
  - [purchase_mailbox, purchase@apexpumps.example, Mailbox buyers use for supplier correspondence]
  - [tds_applicable_on_goods, "true", Buyer turnover is above Rs 10 crore so TDS on purchase of goods applies]
  - [msme_max_days, "45", Most days a micro or small supplier may be paid in when agreed in writing (MSMED Act section 15)]
  - [msme_no_agreement_days, "15", Days a micro or small supplier must be paid in without a written agreement (MSMED Act section 15)]
  - [msme_warn_days, "7", Invoices of small suppliers reaching their deadline within this many days are listed]

# Versioned as a set (task 3.2): version 1 is the full set; a later version copies the one before it with its
# changes [key, category, value]. A match keeps the version in force on the day the invoice was received.
tolerances:
  - version: 1
    effective_from: "2000-01-01"
    note: Set up with the company
    values:
      - [price_pct, "2.00", Invoice price above PO price by this percent is within tolerance]
      - [price_abs, "500.00", Or by this many rupees per line]
      - [qty_pct, "5.00", Invoiced quantity above received quantity by this percent is within tolerance]
      - [small_diff_abs, "100.00", Total invoice difference up to this amount is accepted]
      - [receipt_over_pct, "2.00", Receipt above ordered quantity by this percent is accepted]
      - [supplier_change_pct, "5.00", Supplier quantity change noted by the agent up to this percent]
      - [supplier_price_pct, "2.00", Supplier price rise a buyer may accept up to this percent; above it the purchase manager decides]
      - [supplier_date_days, "3", Supplier delivery date slip accepted by the agent up to this many days]
  - version: 2
    effective_from: "2026-07-01"
    note: Quantity tolerance removed and rupee tolerance cut after the internal audit (D-17)
    changes:
      - [qty_pct, ANY, "0.00", Invoiced quantity above received quantity is not allowed]
      - [price_abs, ANY, "300.00", Or by this many rupees per line]

# The market-gap thresholds (D41, task 12.5): recommended defaults that still need validation with the company (O2)
price_thresholds:
  gap_pct: "5.0000"
  gap_inr_per_unit: "10.00"
  min_saving_inr: "25000.00"
  evidence_max_age_days: 45
  min_sources: 1
  expiry_review_days: 60
  note: Recommended default, needs validation (O2)

budgets:
  periods: ["2025-11", "2028-03"]
  policy: block
  # FY 2027-28 about 8% above (each cost centre's row rounded to Rs 10,000; a location row is the sum of its cost centres')
  next_year: {from: "2027-04", rise_pct: "8", round_to: "10000"}
  # months closed before the demo: the finance manager locks each on the 10th of the next month at 18:00 (next working
  # day), after the GSTR-1 of the 11th is prepared; November 2026 is the first month that can still be locked
  locks: {through: "2026-10", by: U05, reason: Month-end close, day: 10, time: "18:00"}
  per_month:  # cost centre: total, then the total split by GL account (budgets are kept per GL)
    CC-PRD: {total: "1500000.00", gl: {"1410": "1450000.00", "1420": "50000.00"}}
    CC-MNT: {total: "150000.00", gl: {"1430": "100000.00", "5240": "50000.00"}}
