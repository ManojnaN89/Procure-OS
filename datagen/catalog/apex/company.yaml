# Market benchmarks (D52, task 13.1): evidence only, never a price to buy at. Monthly, effective on the month's last
# day (Nov 2025 to Oct 2026 unless `months` says), entered by the buyer and verified by the purchase manager 1-3 working
# days later, except the months in `unverified`. Sources are fictional and the numbers made up (synthetic).
benchmarks:
  entered_by: U03
  verified_by: U08
  series:
    - item: RM-08
      uom: KGS
      basis: delivered
      region: MH
      source_kind: index
      source_name: Enamelled copper wire reference rate (monthly average), Pune bulletin
      source_ref: Pune wire bulletin {month}
      prices: ["870", "879", "875", "890", "888", "883", "892", "891", "889", "897", "899", "897"]
      unverified: ["2026-10"]  # nobody has verified October: on 20 Nov 2026 September (51 days old) is stale
    - item: RM-01
      uom: NOS
      basis: delivered
      region: MH
      source_kind: price_list
      source_name: Kolhapur foundry cluster price list
      source_ref: Kolhapur cluster list {month}
      prices: ["630", "630", "630", "630", "630", "640", "640", "640", "640", "640", "640", "628"]  # October: pig iron dip
    - item: RM-01
      uom: NOS
      basis: delivered
      region: GJ
      source_kind: price_list
      source_name: Rajkot foundry cluster price list
      source_ref: Rajkot cluster list {month}
      months: ["2026-10"]
      prices: ["600"]  # a Gujarat price: never counts for the Maharashtra contract
    - item: RM-06
      uom: NOS
      basis: delivered
      region: ""
