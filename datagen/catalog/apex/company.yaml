      - {do: source, who: U03, on: "2026-11-23", label: after_source}
      - {do: acknowledge, who: U03, on: "2026-11-23", args: {item_code: RM-01, promised: "2026-12-05"}, label: after_ack}
  - name: T2-count-and-arrival
