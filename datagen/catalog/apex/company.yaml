# Block 4 (task 0.2, approval bound to the version; task 1.2, the order approval code). Each scenario is one order from
# the demo reset by the quotation path (production@ asks for `item`, need-by `need_by`, delivery at PLT-CKN; director@
# approves the request; buyer@ awards SUP-005 Pune Copper, else SUP-003, at the first version's price) or, for V5, the
# contract path. A version lists what changed: qty, need_by, a price the supplier `asked` for (accepted), `while:
# submitted` (changed while it waited for approval), `approved` (that version was approved before the next change),
# `touchless` (approved by the rule). The generator works out every version (truth/truth_approval_binding.csv).
# O1 (every email decision needs a code) makes requests only: RM-07 120 (U07) and RM-08 120 (U09); no order truth.
approval_scenarios:
  - {name: V1, title: Approval of the version seen, item: RM-08, need_by: "2026-12-14", versions: [{qty: "120", price: "905.00"}, {qty: "100", while: submitted, approved: true}]}
  - {name: V2, title: Material change after approval, item: RM-08, need_by: "2026-12-14", versions: [{qty: "120", price: "905.00", approved: true}, {need_by: "2026-12-19", approved: true}]}
  - {name: V2b, title: A change that is not material carries the approval, item: RM-08, need_by: "2026-12-14", versions: [{qty: "120", price: "905.00", approved: true}, {qty: "100"}, {need_by: "2026-12-17"}]}
  - {name: V3, title: Date slips add up from the approved date, item: RM-08, need_by: "2026-12-14", versions: [{qty: "120", price: "905.00", approved: true}, {need_by: "2026-12-16"}, {need_by: "2026-12-18", approved: true}]}
  - {name: V4, title: Price rises add up from the first approved price, item: RM-08, need_by: "2026-12-14", versions: [{qty: "120", price: "905.00", approved: true}, {asked: "920.00", approved: true}, {asked: "925.00", approved: true}]}
  - {name: V4b, title: "Price rise at exactly 2% of the first approved price", item: RM-08, need_by: "2026-12-14", versions: [{qty: "120", price: "905.00", approved: true}, {asked: "920.00", approved: true}, {asked: "923.10"}]}
  - {name: V4b-out, title: "One paisa above 2% of the first approved price", item: RM-08, need_by: "2026-12-14", versions: [{qty: "120", price: "905.00", approved: true}, {asked: "920.00", approved: true}, {asked: "923.11"}]}
