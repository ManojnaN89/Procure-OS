      - {do: safety_override, who: U02, on: "2026-11-23", args: {kind: issue, item_code: SP-01, location: PLT-CKN, qty: "3", reference: Lathe 2 main drive, reason: "Lathe 2 is down; the belts cannot wait for the restock"}, label: override_asked}
      - {do: approve_proposal, who: U07, on: "2026-11-23", label: after_override}
      - {do: replenish, who: SYSTEM, on: "2026-11-23", label: after_replenish}
