# Stock check scenarios (block 2: held stock, late supply by rule Q17, safety stock, the store check as a job and after
# events, restock of what is bought for production). Each runs on the demo company from `base` (A0: demo reset and one
# store check with the button; `reset`: the demo reset alone; a scenario name: all of its steps first), then its own
# steps, each on a pinned business date (`on`) by a person (`who`). The generator writes them to
# truth/stock_scenarios.json with the steps of the base spelled out, and works out truth/truth_stock_*.csv from the raw
# files on its own (datagen/generator/stock_scenarios.py).
stock_scenarios:
  - name: A0
    title: "Base: demo reset and one store check"
