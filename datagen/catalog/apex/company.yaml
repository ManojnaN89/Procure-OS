# Forward buying (task 13.5): the company row of the rule is the migration's version 1 (Q27 defaults); these rows narrow
# it. Scenarios start from the stock scenario A0 (demo reset and one store check) on Monday 23 Nov 2026; a scenario's
# benchmark is entered by the buyer and verified by the purchase manager, its rule rows added from that day.
forward_buy:
  entered_by: U03
  verified_by: U08
  stock_base: A0
  rules:
    - {item: RM-08, location: PLT-CKN, storage_max_qty: "1500.0000", note: The wire cage at Chakan holds 1.5 tonnes}
