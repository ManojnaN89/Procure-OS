[project]
name = "p2p"
version = "0.0.1"
description = "Agentic procure-to-pay platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ", "FLY"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"../tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["p2p"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
