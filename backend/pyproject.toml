[project]
name = "p2p"
version = "0.0.1"
description = "Agentic procure-to-pay platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ", "FLY"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"../tests/*" = ["S", "E501", "F811"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["p2p"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
markers = ["scenario: a written scenario of SAP or Dynamics 365 behaviour we copy"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
